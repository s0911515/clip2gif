<!doctype html>
<!-- URL を貼ったときのカード画像（public/og.png）の元。node scripts/make-images.cjs で書き出す -->
<html lang="ja"><head><meta charset="utf-8" />
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px;
    background: #f7f5f2; color: #1f1d1a; position: relative; overflow: hidden;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; color: #e8590c; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  h1 { margin: 56px 0 0; font-size: 76px; line-height: 1.3; font-weight: 800; letter-spacing: 0.01em; }
  .badges { display: flex; gap: 16px; margin-top: 44px; }
  .badges span { font-size: 30px; font-weight: 700; padding: 8px 22px; border-radius: 999px; background: #fff1e8; color: #e8590c; }
  .film { position: absolute; right: -40px; top: 60px; width: 330px; height: 510px; border-radius: 28px;
    background: #e8590c; transform: rotate(8deg); opacity: 0.12; }
</style></head>
<body>
  <div class="film"></div>
  <div class="brand"><img src="../public/icon.svg" alt="" />clip2gif</div>
  <h1>動画の一場面を、<br />軽い GIF・WebP に</h1>
  <div class="badges"><span>登録不要</span><span>無料</span><span>動画は送信されません</span></div>
</body></html>
